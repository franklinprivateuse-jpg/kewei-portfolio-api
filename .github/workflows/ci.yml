# Continuous Integration: run tests and build the Spring Boot API
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Run tests and package
        run: ./mvnw verify --batch-mode

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-api-jar
          path: target/*.jar
          retention-days: 7
spring:
  application:
    name: portfolio-api

  # H2 Database - file mode (data persisted to local file)
  datasource:
    url: jdbc:h2:file:./data/portfolio
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # SQL init for schema (MyBatis project, no JPA)
  sql:
    init:
      mode: always
